# The pull request title becomes the release note, and the body becomes the
# commit message the release notes are built from. Both are checked here
# because both are load bearing and neither fails loudly on its own.
name: title-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            ci
            build
            perf
            revert

  body-parses:
    runs-on: ubuntu-latest
    # A bot writes its body from a template and has no author to teach, so the
    # rule applies to the people who can act on it.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: the body carries no parenthesis
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if printf '%s' "$BODY" | grep -n '[()]'; then
            echo
            echo "The lines above carry a parenthesis. The squash merge writes"
            echo "this body into the commit message, and release-please cannot"
            echo "parse a message that holds one: it drops the whole commit"
            echo "from the release notes without failing anything."
            echo
            echo "Write the body without parentheses. Commas, semicolons and"
            echo "separate sentences carry the same meaning."
            exit 1
          fi
          echo "no parenthesis in the body"

  breaking-carries-a-migration:
    runs-on: ubuntu-latest
    steps:
      - name: a breaking title carries a BREAKING CHANGE footer
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([a-z-]+\))?!:'; then
            echo "not a breaking title, nothing to check"
            exit 0
          fi
          if printf '%s' "$BODY" | grep -q '^BREAKING CHANGE:'; then
            echo "the body carries a BREAKING CHANGE footer"
            exit 0
          fi
          echo "This title carries a '!', so the body needs a BREAKING CHANGE footer."
          echo
          echo "The release notes are built from the squashed commit message."
          echo "Without the footer the release says a break happened and never"
          echo "says how to migrate."
          exit 1
