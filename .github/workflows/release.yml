# What a tag does.
#
# release-please keeps the version and the changelog from the commit subjects
# on main, and opens a pull request that holds them. Merging that pull request
# tags the release, and the tag builds the image and publishes the client.
#
# Nothing here is done by a person, because a release done by hand is a release
# whose steps are remembered differently each time. The one exception is the
# recovery path: a tag whose artefacts failed to publish can be published again
# without cutting a second tag, which is what `workflow_dispatch` is for.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to publish, when its artefacts failed"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # This job always runs and its one step does not. A skipped job propagates
  # its skip down the whole needs chain, and overriding that in each job below
  # was tried and did not work; having nothing skipped is simpler than
  # explaining to every downstream job that a skip upstream was expected.
  please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.1.3
        id: please
        if: github.event_name == 'push'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # What to publish, from whichever of the two ways this ran. One job, so the
  # two below say `needs.plan` and never care which it was.
  plan:
    needs: [please]
    if: needs.please.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      version: ${{ steps.what.outputs.version }}
      major: ${{ steps.what.outputs.major }}
      minor: ${{ steps.what.outputs.minor }}
    steps:
      - id: what
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.please.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          rest="${version#*.}"
          echo "minor=${rest%%.*}" >> "$GITHUB_OUTPUT"

  image:
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry name must be lowercase and a GitHub owner need not be, so
      # `github.repository` cannot be used as an image name directly. The build
      # refused the tag rather than mangling it, which is the right failure and
      # is only useful once somebody folds the case here.
      - name: the image name, lowercased
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          # A bill of materials and a provenance attestation, so somebody who
          # pulled this can ask what is in it and who built it rather than
          # taking the tag's word for it.
          sbom: true
          provenance: mode=max
          # Two architectures, because half of the people running this are on
          # an ARM laptop and the other half are on an x86 server.
          platforms: linux/amd64,linux/arm64
          push: true
          # Four tags: the exact version, the minor line, the major line for
          # somebody who wants fixes without reading release notes, and latest.
          # Written without the leading `v`, because an image tag conventionally
          # carries the version and not the git tag's name for it.
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.plan.outputs.version }}
            ${{ steps.name.outputs.image }}:${{ needs.plan.outputs.major }}.${{ needs.plan.outputs.minor }}
            ${{ steps.name.outputs.image }}:${{ needs.plan.outputs.major }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: attest what was built
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  package:
    needs: [plan]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow rather than a token
      # somebody pasted into a secret and then forgot they had.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      # The interface is built into the wheel, so `pip install blackboardxray`
      # gives an application the client and gives an operator the whole server.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm ci --prefix ui && npm run build --prefix ui
      - run: uv build
      - name: the interface is in the wheel
        # It is generated and therefore gitignored, and a build backend that
        # skips what version control ignores would ship a server serving a
        # blank page. Checked here rather than discovered by whoever installs.
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" > /tmp/wheel.txt
          grep -q "server/web/index.html" /tmp/wheel.txt
          echo "the interface is in $wheel"
      # The twine this bundles has to understand the metadata hatchling writes.
      # v1.12.2 shipped one that predates Metadata-Version 2.5 and reported the
      # name as missing from a wheel that plainly has one.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
