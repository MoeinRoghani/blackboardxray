# What a tag does.
#
# release-please keeps the version and the changelog from the commit subjects
# on main, and opens a pull request that holds them. Merging that pull request
# tags the release, and the tag builds the image and publishes the client.
#
# Nothing here is done by a person, because a release done by hand is a release
# whose steps are remembered differently each time.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.please.outputs.release_created }}
      tag: ${{ steps.please.outputs.tag_name }}
      major: ${{ steps.please.outputs.major }}
      minor: ${{ steps.please.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.1.3
        id: please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        id: build
        with:
          context: .
          # A bill of materials and a provenance attestation, so somebody who
          # pulled this can ask what is in it and who built it rather than
          # taking the tag's word for it.
          sbom: true
          provenance: mode=max
          # Two architectures, because half of the people running this are on
          # an ARM laptop and the other half are on an x86 server.
          platforms: linux/amd64,linux/arm64
          push: true
          # Three tags: the exact version, the major line for somebody who
          # wants patches without reading release notes, and latest.
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.please.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ needs.please.outputs.major }}
            ghcr.io/${{ github.repository }}:${{ needs.please.outputs.major }}.${{ needs.please.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: attest what was built
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  package:
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow rather than a token
      # somebody pasted into a secret and then forgot they had.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      # The interface is built into the wheel, so `pip install blackboardxray`
      # gives an application the client and gives an operator the whole server.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - run: npm ci --prefix ui && npm run build --prefix ui
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@15c56dba361d8335944d31a2ecd17d700fc7bcbc # v1.12.2
