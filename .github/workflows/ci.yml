name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xray
          POSTGRES_PASSWORD: xray
          POSTGRES_DB: xray_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      # From the lockfile, into a virtual environment. `--system` installs into
      # the runner's own interpreter, which Debian marks externally managed and
      # refuses, and `--frozen` is what makes this run the versions the lock
      # names rather than whatever resolved this morning.
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src
      # The database tests skip where no server is named. Naming one here is
      # what stops them silently skipping in the only place it matters.
      - name: The suite, against a real Postgres
        run: |
          uv run pytest -q --strict-markers 2>&1 | tee /tmp/out
          if grep -qE "[0-9]+ skipped" /tmp/out; then
            echo
            echo "A test skipped. Every skip in this suite means the database"
            echo "was not reachable, which makes a green run a green run of"
            echo "about a third of what there is."
            exit 1
          fi
        env:
          BLACKBOARDXRAY_TEST_DSN: postgresql://xray:xray@localhost:5432/xray_test

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm install
        working-directory: ui
      # The token pipeline, the raw-value gate, the contrast gate, and tsc.
      # A screen that sets a value or a pair below its contrast floor fails here.
      - run: npm run verify
        working-directory: ui
      - run: npm run build
        working-directory: ui

      # What `pip install blackboardxray[server]` actually gets. The interface
      # is generated and gitignored, and a build backend that skips what
      # version control ignores ships a server serving a blank page. It has
      # happened twice: once because the wheel target did not name it, and
      # once because the sdist did not and the wheel is built from the sdist.
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - name: the interface is in both distributions
        run: |
          set -euo pipefail
          uv build
          # Listed to a file first. `grep -q` exits on its first match and
          # closes the pipe, `tar` then fails writing to it, and `pipefail`
          # fails the step for a check that actually passed.
          tar tzf dist/*.tar.gz > /tmp/sdist.txt
          unzip -l dist/*.whl > /tmp/wheel.txt
          grep -q "server/web/index.html" /tmp/sdist.txt
          echo "the sdist carries the interface"
          grep -q "server/web/index.html" /tmp/wheel.txt
          test "$(grep -c "server/web/assets/" /tmp/wheel.txt)" -gt 0
          echo "the wheel carries the interface and its assets"

  # The quickstart in the README, run as written: the published image, pulled
  # the way a stranger pulls it. This says the last release still works and the
  # compose file still describes it.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose up -d --wait --wait-timeout 300
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color | tail -80
      - if: always()
        run: docker compose down -v

  # The same assertions against a build of this branch. The job above cannot
  # make them about a change: the compose file names an image and no build, so
  # it pulls the last release whatever the working copy says, and a Dockerfile
  # that has stopped building was found by cutting a version rather than by
  # opening a pull request.
  working-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: >
          docker compose -f docker-compose.yml -f docker-compose.build.yml
          up -d --build --wait --wait-timeout 600
      - run: scripts/smoke.sh
      - name: the image runs the interpreter the Dockerfile names
        run: |
          set -euo pipefail
          named=$(grep -oE '^FROM python:[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          running=$(docker compose -f docker-compose.yml -f docker-compose.build.yml \
            exec -T xray python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          test "$named" = "$running"
      - if: failure()
        run: >
          docker compose -f docker-compose.yml -f docker-compose.build.yml
          logs --no-color | tail -80
      - if: always()
        run: >
          docker compose -f docker-compose.yml -f docker-compose.build.yml
          down -v
