name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xray
          POSTGRES_PASSWORD: xray
          POSTGRES_DB: xray_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      # From the lockfile, into a virtual environment. `--system` installs into
      # the runner's own interpreter, which Debian marks externally managed and
      # refuses, and `--frozen` is what makes this run the versions the lock
      # names rather than whatever resolved this morning.
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run mypy src
      # The database tests skip where no server is named. Naming one here is
      # what stops them silently skipping in the only place it matters.
      - name: The suite, against a real Postgres
        run: |
          uv run pytest -q --strict-markers 2>&1 | tee /tmp/out
          if grep -qE "[0-9]+ skipped" /tmp/out; then
            echo
            echo "A test skipped. Every skip in this suite means the database"
            echo "was not reachable, which makes a green run a green run of"
            echo "about a third of what there is."
            exit 1
          fi
        env:
          BLACKBOARDXRAY_TEST_DSN: postgresql://xray:xray@localhost:5432/xray_test

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm install
        working-directory: ui
      # The token pipeline, the raw-value gate, the contrast gate, and tsc.
      # A screen that sets a value or a pair below its contrast floor fails here.
      - run: npm run verify
        working-directory: ui
      - run: npm run build
        working-directory: ui

      # What `pip install blackboardxray[server]` actually gets. The interface
      # is generated and gitignored, and a build backend that skips what
      # version control ignores ships a server serving a blank page. It has
      # happened twice: once because the wheel target did not name it, and
      # once because the sdist did not and the wheel is built from the sdist.
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - name: the interface is in both distributions
        run: |
          set -euo pipefail
          uv build
          # Listed to a file first. `grep -q` exits on its first match and
          # closes the pipe, `tar` then fails writing to it, and `pipefail`
          # fails the step for a check that actually passed.
          tar tzf dist/*.tar.gz > /tmp/sdist.txt
          unzip -l dist/*.whl > /tmp/wheel.txt
          grep -q "server/web/index.html" /tmp/sdist.txt
          echo "the sdist carries the interface"
          grep -q "server/web/index.html" /tmp/wheel.txt
          test "$(grep -c "server/web/assets/" /tmp/wheel.txt)" -gt 0
          echo "the wheel carries the interface and its assets"

  # The quickstart in the README, run as written. A compose file that has drifted
  # from the Dockerfile is a first impression nobody recovers from, and it is
  # exactly the kind of break the unit tests cannot see.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: The platform answers and says it needs setting up
        run: |
          set -euo pipefail
          test "$(curl -sf localhost:8900/api/v1/ready | jq -r .status)" = ready
          test "$(curl -sf localhost:8900/api/v1/auth/state | jq -r .needs_setup)" = true
      - name: The first run makes an owner, a project and a key that sends
        run: |
          set -euo pipefail
          key=$(curl -sf -X POST localhost:8900/api/v1/setup \
            -H 'content-type: application/json' \
            -H 'origin: http://localhost:8900' \
            -d '{"email":"ci@example.com","password":"a long enough phrase",
                 "organization":"CI","project":"Production"}' | jq -r .api_key)
          test -n "$key"
          curl -sf -X POST localhost:8900/api/v1/ingest \
            -H "authorization: Bearer $key" -H 'content-type: application/json' \
            -d '{"events":[{"board_id":"ci-1","kind":"run.opened"}]}' \
            | jq -e '.stored == 1'
      - name: Reading without a session is refused
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            localhost:8900/api/v1/projects/proj_nothing/overview)
          test "$code" = 401
      - name: The interface is served, not just the API
        run: curl -sf localhost:8900/ | grep -q "<div id=\"root\">"
      - if: failure()
        run: docker compose logs --no-color | tail -80
      - if: always()
        run: docker compose down -v
