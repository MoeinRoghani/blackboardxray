# What checks that a dependency has not gone bad, and that the code has not
# grown a known-shaped hole. Separate from CI because these are slower, and
# because a scheduled run catches an advisory published after a merge.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so an advisory published against an unchanged dependency is found
    # without waiting for somebody to open a pull request.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # CodeQL restricts a pull request's alerts to the lines the pull request
      # touched, which means reading the diff. Without this it reads nothing,
      # asks for the lines "undefined" to "undefined", and the analysis fails
      # with a query error rather than a permission one.
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    # Only meaningful on a pull request: it compares what a change adds against
    # what was there before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          # A copyleft licence arriving through a transitive dependency is a
          # thing to decide about deliberately rather than discover later.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          python-version: "3.12"
      - name: python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --strict
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "24"
      - name: interface dependencies
        working-directory: ui
        # The interface ships as static files, so a vulnerability in a build
        # tool is not a vulnerability in what is served. Production
        # dependencies are the ones that reach a browser.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The binary rather than the action. The action scans the range between
      # two commits, and on a push that has no base it reports a git error and
      # exits non zero having found nothing, which is a red build that says
      # the opposite of what it means. This scans the whole history, once.
      - name: gitleaks
        env:
          VERSION: "8.21.2"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose --exit-code 1
