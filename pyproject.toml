[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blackboardxray"
version = "0.2.2"
description = "A self-hosted observability platform for blackboard runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Moein Roghani", email = "moein.roghani@proton.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# The client half has no dependency. An application already running a
# blackboard adds this package and sends over the standard library.
dependencies = []

[project.optional-dependencies]
# What the server needs. An application sending events installs none of it.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
]
# Faster and pooled sending, where the application already has httpx.
httpx = ["httpx>=0.27"]

[project.scripts]
blackboardxray = "blackboardxray.server.__main__:main"

[project.urls]
Repository = "https://github.com/MoeinRoghani/blackboardxray"

[dependency-groups]
dev = [
    "blackboardxray[server,httpx]",
    # 0.14 is where an agent gained an address as an alternative to a callback,
    # which this has to handle rather than assume away.
    "blackboardx>=0.14.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

# `uv build` builds the sdist and then builds the wheel from that sdist, so an
# artifact missing here is missing from the wheel too however carefully the
# wheel target names it. The interface is generated and gitignored, and this is
# what carries it into both.
[tool.hatch.build.targets.sdist]
artifacts = ["src/blackboardxray/server/web/**"]
exclude = ["ui/node_modules", "ui/dist", ".venv"]

[tool.hatch.build.targets.wheel]
packages = ["src/blackboardxray"]
# The built interface is gitignored, because it is generated and does not
# belong in the history. Hatchling excludes what version control ignores, so
# without this the wheel shipped a server that served nothing: `artifacts`
# names the generated paths that are part of the distribution anyway.
artifacts = ["src/blackboardxray/server/web/**"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The one file somebody runs before they have installed anything, on whichever
# `python3` their machine came with. `datetime.UTC` arrived in 3.11 and macOS
# still ships 3.9, so this spells it the long way on purpose.
"examples/backfill.py" = ["UP017"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers -ra"
pythonpath = ["src"]
